[project]
name = "kordon-norma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Shangin", email = "alarriva@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]

[project.scripts]
kordon-norma = "kordon_norma:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
